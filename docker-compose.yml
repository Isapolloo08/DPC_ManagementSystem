version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chms_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: chms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/db/migrations/001_init_postgres.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./server/src/db/migrations/002_seed_postgres.sql:/docker-entrypoint-initdb.d/02-seed.sql

volumes:
  postgres_data:
